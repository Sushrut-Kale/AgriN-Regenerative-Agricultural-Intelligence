; ============================================================================
; AgriSense IoT — ESP32 DevKit V1 Firmware
; Project: AgriN — Regenerative Agricultural Intelligence Network
; ============================================================================

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

; ----------------------------------------------------------------------------
; Embedded Target: ESP32 DevKit V1 (Physical Hardware & Field Deployment)
; ----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D AGRISENSE_FW_VERSION=\"2.0.0\"
    -D BOARD_ESP32_DEVKIT_V1
    -I include

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit BusIO @ ^1.16.0

board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv

; ----------------------------------------------------------------------------
; Native Target: Host OS (Unit Testing & Desktop Verification without MCU)
; ----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = custom
build_flags =
    -D AGRISENSE_FW_VERSION=\"2.0.0\"
    -D NATIVE_TEST_BUILD
    -std=c++17
    -I include
